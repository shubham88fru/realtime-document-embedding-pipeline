services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: depminio
      MINIO_ROOT_PASSWORD: dep_local_storage
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - dep-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 depminio dep_local_storage; do
          sleep 1
        done
        mc mb --ignore-existing local/document-embedding-pipeline
        mc mb --ignore-existing local/document-embedding-pipeline-test
        mc version enable local/document-embedding-pipeline
        mc version enable local/document-embedding-pipeline-test

volumes:
  dep-minio-data:
